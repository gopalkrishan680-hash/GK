name: Build SpeakUp AI APK

on:
  push:
    paths:
      - "SpeakUpAI/**"
      - ".github/workflows/speakup-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SpeakUpAI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk SpeakUpAI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeakUpAI-apk
          path: SpeakUpAI/SpeakUpAI.apk

      - name: Publish APK to the "speakup-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: speakup-latest
          name: SpeakUp AI (latest build)
          prerelease: true
          files: SpeakUpAI/SpeakUpAI.apk
          body: |
            Latest SpeakUp AI build from `${{ github.ref_name }}` (${{ github.sha }}).
            Download SpeakUpAI.apk on your Android phone and install it (allow "Install unknown apps").
