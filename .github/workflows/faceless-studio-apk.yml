name: Build Faceless Studio APK

on:
  push:
    paths: ["FacelessStudio/**", ".github/workflows/faceless-studio-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FacelessStudio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FacelessStudio-apk
          path: FacelessStudio/app/build/outputs/apk/release/app-release.apk
