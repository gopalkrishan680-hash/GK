name: Build ProCam APK

on:
  push:
    paths:
      - 'ProCamera/**'
      - '.github/workflows/procam-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ProCamera
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ProCam.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProCam-apk
          path: ProCamera/ProCam.apk

      - name: Publish APK as a GitHub Release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: procam-build-${{ github.run_number }}
          name: ProCam build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: ProCamera/ProCam.apk
          body: |
            ProCam camera app – build ${{ github.run_number }} (branch `${{ github.ref_name }}`).
            Phone par **ProCam.apk** download karke install karein.
