name: Build PriceHunt APK

on:
  push:
    paths: ["PriceHunt/**", ".github/workflows/pricehunt-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PriceHunt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PriceHunt-apk
          path: PriceHunt/app/build/outputs/apk/release/app-release.apk
