name: Build GK Camera APK

on:
  push:
    paths:
      - 'camera-app/**'
      - '.github/workflows/camera-app.yml'
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, so every build signs with the same cached key.
concurrency:
  group: gk-camera-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The signing key lives only in the Actions cache, so later builds can update
      # an installed app. If the cache is ever lost, uninstall the app once and reinstall.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/gk-signing
          key: gk-camera-signing-v1

      - name: Create signing key if missing
        run: |
          mkdir -p ~/gk-signing
          if [ ! -f ~/gk-signing/pass ]; then
            openssl rand -hex 16 > ~/gk-signing/pass
            keytool -genkeypair -keystore ~/gk-signing/gkcamera.jks \
              -storepass "$(cat ~/gk-signing/pass)" -keypass "$(cat ~/gk-signing/pass)" \
              -alias gkcamera -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=GK Camera"
          fi

      - name: Build APK
        working-directory: camera-app
        run: |
          export GK_KEYSTORE="$HOME/gk-signing/gkcamera.jks"
          export GK_KEYSTORE_PASS="$(cat ~/gk-signing/pass)"
          ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        run: cp camera-app/app/build/outputs/apk/release/app-release.apk GKCamera.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GKCamera-apk
          path: GKCamera.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gk-camera-latest
          name: GK Camera (latest build)
          prerelease: true
          files: GKCamera.apk
          body: Phone par GKCamera.apk download karke install karein.
