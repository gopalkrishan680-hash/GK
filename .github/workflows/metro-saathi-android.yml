name: Build Metro Saathi APK

on:
  push:
    paths:
      - 'DelhiMetro/**'
      - '.github/workflows/metro-saathi-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DelhiMetro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk MetroSaathi.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetroSaathi.apk
          path: DelhiMetro/MetroSaathi.apk

      - name: Publish APK as a GitHub Release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: metro-saathi-build-${{ github.run_number }}
          name: Metro Saathi build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: DelhiMetro/MetroSaathi.apk
          body: |
            Metro Saathi (Delhi Metro) app – build ${{ github.run_number }} (branch `${{ github.ref_name }}`).
            Phone par **MetroSaathi.apk** download karke install karein.
