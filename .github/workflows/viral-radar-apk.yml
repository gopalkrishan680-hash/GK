name: Build Viral Radar APK

on:
  push:
    paths: ["ViralRadar/**", ".github/workflows/viral-radar-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ViralRadar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew && ./gradlew testReleaseUnitTest assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ViralRadar-apk
          path: ViralRadar/app/build/outputs/apk/release/app-release.apk
