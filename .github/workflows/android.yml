name: Android app

on:
  push:
    branches:
      - main
      - claude/stickman-video-voiceover-sync-ivss4s
      - ccr-cf402e99-zfb3al
      - claude/mythology-video-automation-android-i8lpza
    paths:
      - 'stickman-studio/**'
      - 'stickman-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      # Without the signing secrets, keep one generated key between builds so updates install and the
      # SHA-1 registered for YouTube sign-in stays the same. (The SS_KEYSTORE_* secrets are the lasting option.)
      - uses: actions/cache@v4
        with:
          path: ~/.stickman-signing/app.jks
          key: stickman-signing-key-v1
      - name: Build APK
        env:
          SS_KEYSTORE_BASE64: ${{ secrets.SS_KEYSTORE_BASE64 }}
          SS_KEYSTORE_PASSWORD: ${{ secrets.SS_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$SS_KEYSTORE_BASE64" ]; then
            echo "$SS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export SS_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            echo "Signing with the release key from secrets"
          else
            mkdir -p ~/.stickman-signing
            if [ ! -f ~/.stickman-signing/app.jks ]; then
              keytool -genkeypair -keystore ~/.stickman-signing/app.jks -alias stickman -storepass stickman -keypass stickman \
                -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Stickman Studio"
              echo "Made a new signing key (cached for later builds)"
            fi
            export SS_KEYSTORE_FILE=~/.stickman-signing/app.jks SS_KEYSTORE_PASSWORD=stickman
            echo "No SS_KEYSTORE_BASE64 secret: signing with the cached key"
          fi
          keytool -list -v -keystore "$SS_KEYSTORE_FILE" -storepass "$SS_KEYSTORE_PASSWORD" | grep -E "SHA1:" || true
          gradle -p stickman-android :app:assembleStickmanRelease :app:assembleStudio3dRelease --no-daemon --stacktrace
      - name: Name the APK
        run: |
          cp stickman-android/app/build/outputs/apk/stickman/release/app-stickman-release.apk StickmanStudio.apk
          cp stickman-android/app/build/outputs/apk/studio3d/release/app-studio3d-release.apk 3DStudio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StickmanStudio-apk
          path: |
            StickmanStudio.apk
            3DStudio.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: StickmanStudio-apk
      - name: Publish as the "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          # left-over drafts from an earlier failed publish
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft and .tag_name=="android-latest") | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || true
          done
          sleep 5
          gh release create android-latest StickmanStudio.apk 3DStudio.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Stickman Studio for Android (latest build)" \
            --notes "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}. Download StickmanStudio.apk (or 3DStudio.apk, the 3D Pixar-style app) on your phone and open it to install (allow installing from your browser when Android asks). New builds install over the old one and keep your projects."
          # gh can leave the release as a draft when the tag was still being deleted: publish it
          for n in 1 2 3 4 5; do
            draft=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.tag_name=="android-latest")][0].draft')
            if [ "$draft" = "false" ]; then echo "Published"; exit 0; fi
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.tag_name=="android-latest")][0].id')
            [ -n "$id" ] && gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false -f tag_name=android-latest -f target_commitish="$GITHUB_SHA" >/dev/null || true
            sleep 5
          done
          echo "The release is still a draft"; exit 1

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: StickmanStudio-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator (self-test)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash stickman-android/ci/smoke.sh StickmanStudio.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-result
          path: |
            screen.png
            screen-link.png
            logcat.txt
