name: Android app

on:
  push:
    branches:
      - main
      - claude/stickman-video-voiceover-sync-ivss4s
    paths:
      - 'stickman-studio/**'
      - 'stickman-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      # Without the signing secrets, keep the runner's debug key between builds so updates still install.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: stickman-debug-keystore
      - name: Build APK
        env:
          SS_KEYSTORE_BASE64: ${{ secrets.SS_KEYSTORE_BASE64 }}
          SS_KEYSTORE_PASSWORD: ${{ secrets.SS_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$SS_KEYSTORE_BASE64" ]; then
            echo "$SS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export SS_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            echo "Signing with the release key from secrets"
          else
            echo "No SS_KEYSTORE_BASE64 secret: signing with the cached debug key"
          fi
          gradle -p stickman-android :app:assembleRelease --no-daemon --stacktrace
      - name: Name the APK
        run: cp stickman-android/app/build/outputs/apk/release/app-release.apk StickmanStudio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StickmanStudio-apk
          path: StickmanStudio.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: StickmanStudio-apk
      - name: Publish as the "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create android-latest StickmanStudio.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Stickman Studio for Android (latest build)" \
            --notes "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}. Download StickmanStudio.apk on your phone and open it to install (allow installing from your browser when Android asks). New builds install over the old one and keep your projects."

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: StickmanStudio-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator (self-test)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash stickman-android/ci/smoke.sh StickmanStudio.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-result
          path: |
            screen.png
            logcat.txt
